name: Daily Contribution

on:
  schedule:
    - cron: "30 12 * * *"   # 6:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update activity
        run: |
          echo "Daily update: $(date -u)" >> activity.txt

      - name: Commit changes
        run: |
          git config user.name "prince1205-code"
          git config user.email "princekumar16u@gmail.com"
          git add activity.txt
          git commit -m "chore: daily update" || exit 0
          git push
